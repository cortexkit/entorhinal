[package]
name = "entorhinal-module"
version = "0.1.3"
edition = "2021"
publish = false
description = "The ck-entorhinal supervised subc module."

[[bin]]
name = "ck-entorhinal"
path = "src/main.rs"

[dependencies]
entorhinal-core = { path = "../entorhinal-core" }
cortexkit-store-types = { workspace = true }
cortexkit-log = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The e2e test spawns the daemon and the module as child processes, which
# needs tokio's process feature. Declared here because nothing else in the
# dependency graph enables it for this crate.
tokio = { workspace = true, features = ["process"] }
subc-transport = { workspace = true }
