[package]
name = "entorhinal-module"
version = "0.1.21"
edition = "2021"
license = "MIT"
repository = "https://github.com/cortexkit/entorhinal"
publish = false
description = "The ck-entorhinal supervised subc module."
build = "build.rs"

[[bin]]
name = "ck-entorhinal"
path = "src/main.rs"

[[bin]]
name = "ckdev-argv-echo"
path = "src/bin/ckdev-argv-echo.rs"
test = false

[dependencies]
entorhinal-core = { path = "../entorhinal-core" }
cortexkit-store-types = { workspace = true }
cortexkit-log = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
cortexkit-test-support = "0.1.0"
rusqlite = { workspace = true }
# The e2e test spawns the daemon and the module as child processes, which
# needs tokio's process feature. Declared here because nothing else in the
# dependency graph enables it for this crate.
# Writer deadline tests advance a paused clock instead of timing SQLite work.
tokio = { workspace = true, features = ["process", "test-util"] }
subc-transport = { workspace = true }
# The operator-confirmation end-to-end tests drive the real handler against
# the library's in-process stand-in daemon. Test builds only: the release
# binary's dependency graph never carries the stand-in.
subc-client-rs = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_System_Threading"] }
