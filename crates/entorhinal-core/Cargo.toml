[package]
name = "entorhinal-core"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cortexkit/entorhinal"
publish = false
description = "Pure domain and journal-spine store for the ck-entorhinal registry."

[dependencies]
blake3 = { workspace = true }
cortexkit-paths = { workspace = true }
cortexkit-lease = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-store-types = { workspace = true }
getrandom = { workspace = true }
icu_casemap = "=1.5.0"
icu_normalizer = "=1.5.0"
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
