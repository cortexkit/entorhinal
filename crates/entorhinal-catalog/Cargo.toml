[package]
name = "entorhinal-catalog"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure verification and deterministic resolution for the CK catalog v1 contract"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
subc-protocol = { workspace = true }
