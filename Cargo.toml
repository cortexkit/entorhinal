[workspace]
resolver = "2"
members = ["crates/entorhinal-core", "crates/entorhinal-module"]

[workspace.dependencies]
# Every CortexKit dependency comes from crates.io, so a fresh clone builds with
# no sibling checkouts beside it.
subc-client-rs = "0.17.0"
subc-protocol = "0.24.1"
subc-transport = "0.7.3"
subc-jsonc = "0.1.1"

cortexkit-paths = "0.1.1"
cortexkit-store = { version = "0.2.0", features = ["sqlite"] }
cortexkit-store-types = "0.2.2"
cortexkit-log = "0.3.3"
tracing = "0.1"
cortexkit-lease = "0.1.0"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
