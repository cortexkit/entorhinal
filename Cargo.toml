[workspace]
resolver = "2"
members = ["crates/entorhinal-core", "crates/entorhinal-module"]

# During local development this workspace is nested under the subconscious checkout.
# The production repository uses the sibling checkout layout in CI.
[workspace.dependencies]
subc-client-rs = { path = "../subconscious/crates/subc-client-rs" }
subc-protocol = { path = "../subconscious/crates/subc-protocol" }
subc-transport = { path = "../subconscious/crates/subc-transport" }
subc-core = { path = "../subconscious/crates/subc-core" }
subc-jsonc = { path = "../subconscious/crates/subc-jsonc" }

cortexkit-paths = { path = "../commons/crates/cortexkit-paths" }
cortexkit-store = { path = "../commons/crates/cortexkit-store", features = ["sqlite"] }
cortexkit-store-types = { path = "../commons/crates/cortexkit-store-types" }
cortexkit-lease = { path = "../commons/crates/cortexkit-lease" }
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
