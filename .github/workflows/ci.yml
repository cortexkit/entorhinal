name: CI

on:
  push:
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Main and nightly audits must finish even if another push arrives.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CK_MUTATE_REV: 46cc166b0df2edcfd14b3eb54ed6eeac588fed69

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every CortexKit dependency comes from crates.io, so the repository
      # builds from its own checkout with no sibling repositories and no token.
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - uses: actions/cache@v4
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}

      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate

      - name: Check mutation anchors and exact test names
        run: |
          ckdev-mutate --version
          ckdev-mutate check

  mutations:
    name: Mutation proofs (ubuntu, shard ${{ matrix.shard }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Each shard owns a separate checkout; never replay concurrently in one tree.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}

      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate

      - name: Replay touched rows on every push and PR
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          mkdir -p target/mutations
          ckdev-mutate run --diff origin/main --shard ${{ matrix.shard }}/4 --report target/mutations/diff.json

      - name: Replay full catalogue on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p target/mutations
          ckdev-mutate run --all --shard ${{ matrix.shard }}/4 --report target/mutations/all.json

      - name: Audit all package targets nightly or on demand
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p target/mutations
          ckdev-mutate run --all --broad --shard ${{ matrix.shard }}/4 --report target/mutations/broad.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutations-${{ github.event_name }}-${{ matrix.shard }}
          path: target/mutations/*.json
