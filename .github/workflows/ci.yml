name: CI

on:
  push:
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # Only the newest push matters: deploys don't wait on CI, so an older push's
  # run is superseded. The nightly and on-demand audits always finish.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CK_MUTATE_REV: 8200b61fe4250989d315ed8064d16754c5032d10

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every CortexKit dependency comes from crates.io, so the repository
      # builds from its own checkout with no sibling repositories and no token.
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check that nothing internal under .cortexkit/ is tracked
        run: scripts/check-cortexkit-layout.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - uses: actions/cache@v4
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}

      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        # --force: rust-cache can restore an older ckdev-mutate into
        # ~/.cargo/bin, and a pin change must replace it.
        run: cargo install --locked --force --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate

      - name: Check mutation anchors and exact test names
        run: |
          ckdev-mutate --version
          ckdev-mutate check --strict

  native:
    name: Native (${{ matrix.os }}${{ matrix.shard && format(' {0}/3', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the suite three times slower than macOS, mostly in
        # per-test filesystem and process costs, so it is split across three
        # runners by test-name hash; each runs a third of every test binary.
        include:
          - os: macos-latest
            shard: 0
          - os: windows-latest
            shard: 1
          - os: windows-latest
            shard: 2
          - os: windows-latest
            shard: 3
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Require PowerShell 7.3+ on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null; then
            echo '::error::missing pwsh 7.3+ on PATH'
            exit 1
          fi
          pwsh -NoProfile -NonInteractive -Command '
            if ($PSVersionTable.PSVersion -lt [version]"7.3") {
              Write-Error "missing pwsh 7.3+ on PATH"
              exit 1
            }
            $PSVersionTable.PSVersion.ToString()
          '

      # Defender scans every new test binary, scratch folder and SQLite file
      # the suite creates. Excluding the build and temp folders cut the module's
      # Windows test time from 912 s to 559 s. These are disposable CI runners,
      # so nothing outside this job relies on the scanning.
      - name: Exclude the build and temp folders from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, $env:RUNNER_TEMP, "$env:USERPROFILE\.cargo"
          Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-targets --locked --no-fail-fast

      - uses: taiki-e/install-action@nextest
        if: runner.os == 'Windows'

      # nextest runs each test in its own process, so a test that leans on
      # state another test left in the same process fails here first.
      - name: Test (Windows shard)
        if: runner.os == 'Windows'
        run: cargo nextest run --workspace --all-targets --locked --no-fail-fast --partition hash:${{ matrix.shard }}/3

  mutations:
    name: Mutation proofs (ubuntu, shard ${{ matrix.shard }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Each shard owns a separate checkout; never replay concurrently in one tree.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Each replay rebuilds the crate it breaks; cached dependencies keep
      # that to entorhinal's own code.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/cache@v4
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}

      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        # --force: rust-cache can restore an older ckdev-mutate into
        # ~/.cargo/bin, and a pin change must replace it.
        run: cargo install --locked --force --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate

      # Pushes replay only the rows their own changes touch. The whole catalogue
      # runs nightly, so a push never waits on it.
      - name: Replay touched rows on every push and PR
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p target/mutations
          base=origin/main
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          ckdev-mutate run --diff "$base" --narrow --shard ${{ matrix.shard }}/8 --report target/mutations/diff.json

      - name: Audit all package targets nightly or on demand
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p target/mutations
          ckdev-mutate run --all --broad --shard ${{ matrix.shard }}/8 --report target/mutations/broad.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutations-${{ github.event_name }}-${{ matrix.shard }}
          path: target/mutations/*.json
