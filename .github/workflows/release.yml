name: Release

on:
  push:
    tags: ['v*']
  # A manual run rehearses the same build, signing and verification without
  # writing to GitHub Releases, even when the core floor is not set yet.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Set to the oldest public core that accepts Entorhinal's registration.
  ENTORHINAL_REQUIRES_CORE: ''

jobs:
  verify:
    name: Verify release version and source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Compare the tag against the entorhinal-module crate version
        id: source
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          [[ "$revision" == "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")" ]]
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "entorhinal-module"))')
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the entorhinal-module crate version $version"
            exit 1
          fi
          printf 'revision=%s\nversion=%s\n' "$revision" "$version" >> "$GITHUB_OUTPUT"

      - name: Require a core floor and green push CI for a publishable tag
        if: github.event_name == 'push'
        shell: bash
        env:
          REVISION: ${{ steps.source.outputs.revision }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/assets.py check-floor
          # The version bump lives on the release branch, not main.
          branch="release/$RELEASE_VERSION"
          if ! git merge-base --is-ancestor "$REVISION" "origin/$branch"; then
            echo "::error::$REVISION has not landed on origin/$branch"
            exit 1
          fi
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$REVISION" --branch "$branch" \
            --event push --status success --limit 100 --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            # A skipped job or suite can leave a green workflow. Check every
            # job by name and require each of its platform's test steps to run.
            green=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status,conclusion,event,headBranch,headSha,jobs \
              | jq --arg revision "$REVISION" --arg branch "$branch" '
                .headSha == $revision and .headBranch == $branch and .event == "push"
                and .status == "completed" and .conclusion == "success"
                and ([.jobs[].name] | sort) == [
                  "Native (macos-latest)", "Native (windows-latest 1/3)",
                  "Native (windows-latest 2/3)", "Native (windows-latest 3/3)", "Test (ubuntu)"
                ]
                and all(.jobs[];
                  (if (.name | startswith("Native (windows-latest "))
                   then "Test (Windows shard)" else "Test" end) as $suite
                  | .status == "completed" and .conclusion == "success"
                  and ([.steps[]? | select(.name == $suite) | .conclusion] == ["success"])
                )')
            if [[ "$green" == true ]]; then
              echo "Verified push CI run $run for $REVISION"
              exit 0
            fi
          done
          echo "::error::no successful ci.yml push run on $branch for $REVISION ran all five CI jobs and their tests"
          exit 1

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ (matrix.target == 'linux-arm64' || matrix.target == 'windows-arm64') && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: windows-x64
            runner: windows-latest
          - target: windows-arm64
            runner: windows-11-arm
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Require the native runner and Rust toolchain
        run: |
          host=$(rustc --print host-tuple)
          case "$RELEASE_TARGET:$RUNNER_ARCH:$host" in
            darwin-arm64:ARM64:aarch64-apple-darwin|linux-x64:X64:x86_64-unknown-linux-gnu|linux-arm64:ARM64:aarch64-unknown-linux-gnu) ;;
            windows-x64:X64:x86_64-pc-windows-msvc|windows-arm64:ARM64:aarch64-pc-windows-msvc) ;;
            *) echo "::error::$RELEASE_TARGET requires a native runner and Rust toolchain; found $RUNNER_ARCH / $host"; exit 1 ;;
          esac

      - name: Require PowerShell 7.3+ on PATH
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]"7.3") {
            throw "missing pwsh 7.3+ on PATH"
          }
          $PSVersionTable.PSVersion.ToString()

      # Match Windows push CI so Defender does not scan every test binary
      # and temporary SQLite file the suite creates on this disposable runner.
      - name: Exclude the build and temp folders from Defender
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, $env:RUNNER_TEMP, "$env:USERPROFILE\.cargo"
          Set-MpPreference -DisableRealtimeMonitoring $true

      # Push CI does not cover these two native targets.
      - name: Test natively on ARM64
        if: matrix.target == 'linux-arm64' || matrix.target == 'windows-arm64'
        run: cargo test --workspace --locked

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and check ck-entorhinal
        run: bash scripts/release-build.sh

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          : "${DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64:?missing Developer ID certificate}"
          : "${DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD:?missing Developer ID certificate password}"
          umask 077
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          password=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          export CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          python -c 'import base64,os; open(os.environ["CERTIFICATE_PATH"], "wb").write(base64.b64decode(os.environ["DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$CERTIFICATE_PATH" -k "$keychain" -P "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" -A
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          rm -f "$CERTIFICATE_PATH"

      - name: Sign, package and notarize the macOS archive
        if: runner.os == 'macOS'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          : "${APP_STORE_CONNECT_API_KEY:?missing App Store Connect API key}"
          export APP_STORE_CONNECT_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$APP_STORE_CONNECT_API_KEY_PATH"
          unset APP_STORE_CONNECT_API_KEY
          bash scripts/release/macos-sign-notarize.sh target/release target/release-assets "$RELEASE_TARGET"

      - name: Remove signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi

      - name: Package the Linux or Windows archive
        if: runner.os != 'macOS'
        run: python scripts/release/assets.py pack target/release target/release-assets "$RELEASE_TARGET"

      - name: Verify the packaged binary and checksum the final ZIP
        run: python scripts/release/assets.py verify-target target/release-assets "$RELEASE_TARGET" "$RELEASE_VERSION" "$RELEASE_REVISION"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: target/release-assets/
          if-no-files-found: error

  assemble:
    name: Verify all assets and generate the release manifest
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: built-assets
          merge-multiple: true

      - name: Verify inventory, checksums and manifest inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          flags=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            flags+=(--dry-run)
          fi
          python3 scripts/release/assets.py assemble built-assets release-assets "$RELEASE_VERSION" "${flags[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Verify uploaded draft and publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Upload to a draft, verify remote bytes, then publish
        shell: bash
        env:
          RELEASE_REVISION: ${{ needs.verify.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --draft --verify-tag \
            --title "Entorhinal $GITHUB_REF_NAME" --generate-notes
          gh release download "$GITHUB_REF_NAME" --pattern '*' --dir draft-assets
          diff -r release-assets draft-assets
          tag_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [[ "$tag_revision" != "$RELEASE_REVISION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME no longer refers to $RELEASE_REVISION; leaving the release as a draft"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
