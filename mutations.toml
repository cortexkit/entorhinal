# Mutation proofs for ckdev-mutate 0.9.8 (commons 0c99c7e16d8ae22b6e114136b6b7b68be6f1394e).
# Anchors are copied from production code; named tests must turn red, not time out.
# Defaults allow 1800 s to build and 600 s to test on a clean CI runner.
# Reports belong under the already gitignored target/mutations/.
# only=false allows related assertions in the same target; nightly --broad audits other targets.

