  { file = "crates/entorhinal-module/src/shared_write.rs", old = "sent = true;\n            match timeout_at(", new = "sent = true;\n            attempts += 1;\n            match timeout_at(" },
  { file = "crates/entorhinal-module/src/shared_write.rs", old = "self.log_client.append(request),", new = "self.log_client.append(&AppendRequest { data: if attempts > 1 { [request.data.clone(), vec![b' ']].concat() } else { request.data.clone() }, ..request.clone() })," },
]
