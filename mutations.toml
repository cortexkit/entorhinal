[[control]]
id = "create-avatar-consent-tools"
guards = "Consent-approved hire and head creation both draw a default avatar that the second Mac receives"
file = "crates/entorhinal-module/src/shared_write.rs"
old = '|| matches!(&prepared, Some(Write::Consent(plan,_)) if matches!(plan.tool.as_str(), "agents_hire" | "agents_create_head"));'
new = '|| false; // NON-VACUITY BREAK'
test_file = "crates/entorhinal-module/src/two_machine_acceptance.rs"
runner = "cargo"
package = "entorhinal-module"
target = "--bin ck-entorhinal"
select = "expected"
expect_red = ["two_machine_acceptance::consent_workspace_and_hire_replicate_without_local_authority_rows"]

# Stopping the catalog must outlast the blocking jobs that hold a store handle.
[[control]]
id = "catalog-stop-waits-for-blocking-jobs"
guards = "Stopping the catalog waits until its poll and startup-seed blocking jobs have released the store"
file = "crates/entorhinal-module/src/catalog_poll.rs"
old = "        self.catalog_sql.wait().await;"
new = "        // NON-VACUITY BREAK: return before blocking jobs end"
test_file = "crates/entorhinal-module/src/catalog_seed_tests.rs"
runner = "cargo"
package = "entorhinal-module"
target = "--bin ck-entorhinal"
select = "expected"
expect_red = ["catalog_seed::tests::stopping_the_catalog_waits_for_a_running_seed_job"]


[[control]]
id = "agent-where-many-duplicate-refusal"
guards = "Batch cached claim reads reject duplicate agent identifiers before reading any rows"
file = "crates/entorhinal-module/src/claims.rs"
old = "if !seen.insert(id.clone()) {"
new = "if seen.insert(id.clone()) && false { // NON-VACUITY BREAK"
test_file = "crates/entorhinal-module/src/claims.rs"
runner = "cargo"
package = "entorhinal-module"
target = "--bin ck-entorhinal"
select = "expected"
expect_red = ["claims::tests::where_many_refuses_duplicate_ids"]
