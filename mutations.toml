[[control]]
id = "move-digest-abort-publication"
guards = "Receiver abort cannot publish the state that permits source unfreeze before its participants finish undo"
file = "crates/entorhinal-module/src/move_receiver.rs"
old = 'self.return_claim(row, plan).await?;'
new = '''self.return_claim(row, plan).await?;
        let (record, _) = self.read_move(plan).await?;
        if record.state != State::Aborted {
            self.cas_move(row, plan, record.state, State::Aborted).await?; // NON-VACUITY BREAK
        }'''
test_file = "crates/entorhinal-module/src/move_receiver.rs"
runner = "cargo"
package = "entorhinal-module"
target = "--bin ck-entorhinal"
expect_red = ["move_receiver::tests::receiver_digest_mismatch_abort_stuck_retries_once_on_restart"]

