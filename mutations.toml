# Mutation proofs for ckdev-mutate 0.12.3 (commons 8200b61fe4250989d315ed8064d16754c5032d10).
# Anchors are copied from production code; named tests must turn red, not time out.
# Defaults allow 1800 s to build and 600 s to test on a clean CI runner.
# Reports belong under the already gitignored target/mutations/.
# only=false allows related assertions in the same target. CI's nightly --broad
# audits all package targets, except rows narrowed with select="expected".

