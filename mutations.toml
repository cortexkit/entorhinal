# Writing to the shared log: recovering an interrupted write, and the checks
# before re-enable replaces this machine's own earlier snapshot. Breaks in the
# retry logic change only the resends, never the first attempt.
[[control]]
id = "writer-resend-original-head"
guards = "An append retry resends its original expected_head, even if its lost reply already advanced the log"
edits = [
  { file = "crates/entorhinal-module/src/shared_write.rs", old = "let mut sent = false;\n        loop {", new = "let mut sent = false;\n        let mut attempts = 0; // NON-VACUITY BREAK\n        loop {" },
  { file = "crates/entorhinal-module/src/shared_write.rs", old = "sent = true;\n            match timeout_at(", new = "sent = true;\n            attempts += 1;\n            match timeout_at(" },
  { file = "crates/entorhinal-module/src/shared_write.rs", old = "self.log_client.append(request),", new = "self.log_client.append(&AppendRequest { expected_head: request.expected_head + u64::from(attempts > 1), ..request.clone() })," },
]
test_file = "crates/entorhinal-module/src/shared_write.rs"
runner = "cargo"
package = "entorhinal-module"
target = "--bin ck-entorhinal"
expect_red = ["shared_write::tests::lost_reply_resends_identical_bytes_id_and_stale_head_and_commits_once"]

[[control]]
